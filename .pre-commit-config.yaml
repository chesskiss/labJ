repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^agents/controller\.py$
      - id: ruff-format
        exclude: ^agents/controller\.py$
  
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        pass_filenames: false
        args:
          - --ignore-missing-imports
          - context_action_plan
          - plan_validation
          - executor_runtime
          - orchestration_api
          - journal_api
          - db
          - tools
          - stt
        additional_dependencies:
          - types-requests
