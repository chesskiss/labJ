name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos-installer:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            desktop/package-lock.json
            ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create placeholder .env
        run: |
          printf "LLM_API_KEY=\n" > .env

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build macOS installer
        working-directory: desktop
        env:
          LABJ_PYTHON_BIN: python3
          LABJ_EXPECTED_PYTHON_VERSION: "3.11"
        run: npm run dist:mac

      - name: Smoke test packaged runtime
        working-directory: desktop
        env:
          LABJ_EXPECTED_PYTHON_VERSION: "3.11"
        run: npm run smoke:runtime

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: labj-macos-installer
          path: desktop/release/*.dmg
          if-no-files-found: error
