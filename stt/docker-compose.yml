services:
  stt:
    build: .
    container_name: faster-whisper-stt
    ports:
      - "8001:8000"
    environment:
      # Model: tiny, base, small, medium, large-v3, large-v3-turbo
      # Bigger = more accurate but slower & more RAM
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_WORKERS=4
    volumes:
      # Cache models on host so they persist across rebuilds
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  model-cache:
